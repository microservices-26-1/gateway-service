apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
data:
  CORS_ALLOWED_CREDENTIALS: "true"
  CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:80,http://localhost:8081"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: youcancallmegus/gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: gateway-config

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  selector:
    app: gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer