spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:

          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOrigins: ${CORS_ALLOWED_ORIGINS}
                allowedHeaders: "*"
                allowedMethods: "*"
                allowCredentials: ${CORS_ALLOWED_CREDENTIALS}

          routes:

            - id: accounts
              uri: http://account:8080 
              predicates:
                - Path=/accounts/**

            - id: auth
              uri: http://auth:8080
              predicates:
                - Path=/auth/**

            - id: products
              uri: http://product:8080
              predicates:
                - Path=/products/**